name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · boundaries · test · graph
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Ownership boundaries (dependency-cruiser)
        run: ./scripts/boundaries.sh

      - name: Test (with coverage)
        run: npx jest --silent --coverage --passWithNoTests

      - name: Project graph is current
        run: |
          ./scripts/graph.sh --check || {
            echo "::error::The committed project graph (docs/graph/) is stale. Run 'scripts/graph.sh' locally and commit the result."
            exit 1
          }
